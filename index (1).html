<style>
  :root {
    --green: #0e6b3b;
    --green-bright: #12834a;
    --garnet: #6e0f2b;
    --white: #ffffff;
    --ink: #3b0a1a;
    --font: "Fredoka", ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    min-height: 100%;
    background: var(--garnet);
    background: linear-gradient(160deg, var(--garnet) 0%, var(--green) 100%);
    background: linear-gradient(160deg in oklch, var(--garnet) 0%, var(--green) 100%);
    background-attachment: fixed;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--font);
    color: var(--white);
    display: flex;
    justify-content: center;
    padding: max(48px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--white);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .3);
    background: var(--white);
  }

  h1 {
    margin-top: 20px;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: .01em;
  }

  .tagline {
    margin-top: 6px;
    font-size: 1.05rem;
    font-weight: 400;
    line-height: 1.4;
    max-width: 30ch;
    opacity: .92;
  }

  nav {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 12px 20px 12px 12px;
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 500;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
    transition: transform .2s ease, box-shadow .2s ease;
    opacity: 0;
    animation: enter .6s cubic-bezier(.2, .8, .2, 1) forwards;
    animation-delay: calc(.15s + var(--i) * .12s);
  }

  .btn .icon {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--green-bright);
    color: var(--white);
    transition: background .2s ease;
  }

  .btn .icon svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn .label { flex: 1; text-align: center; padding-right: 44px; }

  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(0, 0, 0, .3); }
  .btn:hover .icon { background: var(--garnet); }
  .btn:active { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }

  footer {
    margin-top: 40px;
    font-size: .85rem;
    opacity: .7;
  }

  @keyframes enter {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { animation: none; opacity: 1; transition: none; }
  }
</style>
</head>
